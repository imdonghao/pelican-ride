<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#112331">
<meta name="description" content="Pelican Ride：可调速、可暂停、可切换天气的互动 SVG 鹈鹕骑行实验。">
<title>Pelican Ride · 动态鹈鹕骑行实验</title>
<style>
:root{color-scheme:dark;--bg:#10222e;--panel:#1a3443;--border:#31505e;--light:#f3faf5;--muted:#a3b8bf;--mint:#c0f6c9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -25%,#2c5a60,transparent 65%),var(--bg);color:var(--light);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif;min-height:100vh}
button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
.wrap{width:min(1080px,100%);margin:auto;padding:20px clamp(14px,4vw,34px) 35px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;letter-spacing:.13em;font-size:12px;font-weight:900}.logo{display:grid;place-items:center;width:39px;height:39px;border-radius:13px;background:var(--mint);color:#193c3b;font-size:23px}
.pill{border:1px solid #4d816f;border-radius:99px;padding:8px 12px;color:var(--mint);font-size:11px;white-space:nowrap;font-weight:800}.pill:before{content:"●";font-size:9px;margin-right:6px}
h1{font-size:clamp(36px,8vw,79px);line-height:1.05;letter-spacing:-.065em;margin:0 0 11px;font-weight:900}h1 span{color:var(--mint)}
.sub{margin:0 0 25px;color:var(--muted);font-size:clamp(12px,2.6vw,16px);line-height:1.65}
.stage{position:relative;overflow:hidden;border:1px solid #7aa5a8;border-radius:23px;background:#d9e9dc;box-shadow:0 22px 65px #0004;isolation:isolate}
.stage svg{width:100%;height:auto;display:block;aspect-ratio:1000/650}
.stage[data-scene=sunset] #skyStart{stop-color:#ef978b}.stage[data-scene=sunset] #skyEnd{stop-color:#ffe7ae}
.stage[data-scene=night] #skyStart{stop-color:#18334e}.stage[data-scene=night] #skyEnd{stop-color:#507b8d}
.stage[data-scene=night] #sun{fill:#f2f4db;opacity:.85}
.stage[data-scene=night] .cloud{opacity:.12}
.stage[data-scene=night] .backhill{fill:#395d60}
.stage[data-scene=night] .fronthill{fill:#376559}
.cloud{animation:drift 20s ease-in-out infinite alternate}.cloud.two{animation-delay:-10s;animation-duration:25s}
@keyframes drift{from{transform:translateX(-25px)}to{transform:translateX(48px)}}
#bird{transform-origin:440px 255px;animation:bob 1.1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.roadmark{stroke:#fef8dd;stroke-width:7;stroke-linecap:round;opacity:.9}
.tag{position:absolute;bottom:17px;left:17px;background:#143443d9;backdrop-filter:blur(8px);color:white;padding:9px 12px;font-size:12px;border-radius:12px;font-weight:700}
.data{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}
.stat{background:var(--panel);border:1px solid var(--border);padding:18px 17px;border-radius:18px;min-width:0}
.stat small{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.stat strong{font-size:clamp(24px,5vw,41px);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.stat span{font-size:12px;color:var(--muted);margin-left:3px}
.controls{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;font-size:13px;font-weight:800}
.readout{color:var(--mint);font-size:12px}
input[type=range]{width:100%;height:30px;accent-color:var(--mint)}
.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.scenes,.actions{display:flex;gap:8px}
.scenes{margin-top:14px}
.scenes button,.actions button{flex:1;min-width:0;border-radius:12px;padding:11px 6px;background:#254353;border:1px solid #476577;color:white;font-weight:800;font-size:12px}
.scenes button[aria-pressed=true]{border-color:var(--mint);background:#3b6962}
.actions button{padding:14px 8px;min-height:46px;font-size:13px}
.actions #toggle{color:#16392f;background:var(--mint);border-color:var(--mint)}
.hint{margin:13px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:20px 2px 0;color:#92aeb6;font-size:11px}footer b{color:#d6f4e4}
@media(max-width:670px){.wrap{padding-top:14px}.nav{margin-bottom:22px}.brand{font-size:10px}.pill{font-size:10px}.sub{margin-bottom:20px}.stage{border-radius:16px}.tag{bottom:10px;left:10px;font-size:10px;padding:7px 9px}.data{gap:7px;margin:12px 0}.stat{padding:12px 9px;border-radius:13px}.stat small{font-size:10px}.stat strong{font-size:clamp(21px,6vw,31px)}.stat span{font-size:10px}.controls{grid-template-columns:1fr;gap:22px;padding:16px;border-radius:17px}}
@media(prefers-reduced-motion:reduce){.cloud,#bird{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="nav"><div class="brand"><div class="logo">P</div>PELICAN MOTION LAB</div><div class="pill" id="status">正在骑行</div></header>

<p class="sub">Pelican Test · 完全使用 SVG 绘制，车轮、脚踏与双腿实时联动 · 支持手机触控</p>

</g>

<path d="M409 236Q463 295 544 297M401 249Q467 309 557 309" stroke="#c8a98d" stroke-width="3" fill="none" stroke-linecap="round"/>

</g>
<!-- moving legs and feet -->
<g id="legs" fill="none" stroke-linecap="round" stroke-linejoin="round">

</g>

<g stroke="#f1c99e" stroke-width="3" opacity=".75"><path d="M654 343H731M657 359H727M671 327L675 384M710 327L708 384"/></g>

<text x="935" y="624" text-anchor="end" fill="#2e6b6d" font-family="Arial,sans-serif" font-size="13" letter-spacing="1">GPT-6 · LIVE SVG</text>
</svg>
<div class="tag" id="sceneLabel">☀️ 晴天海岸 · 骑行中</div>
</section>
<section class="data" aria-label="实时骑行数据">
<div class="stat"><small>实时速度</small><strong id="speedValue">12</strong><span>km/h</span></div>
<div class="stat"><small>累计里程</small><strong id="distanceValue">0.00</strong><span>km</span></div>
<div class="stat"><small>车轮转数</small><strong id="revsValue">0</strong><span>圈</span></div>
</section>
<section class="controls" aria-label="动画控制">
<div><div class="row"><label for="speed">调整骑行速度</label><span class="readout" id="speedText">12 km/h</span></div><input id="speed" type="range" min="0" max="30" step="1" value="12" aria-label="骑行速度"><div class="ends"><span>0 停靠</span><span>15 悠闲</span><span>30 冲刺</span></div><div class="scenes"><button type="button" class="scene" data-scene="day" aria-pressed="true">☀️ 白天</button><button type="button" class="scene" data-scene="sunset" aria-pressed="false">🌇 日落</button><button type="button" class="scene" data-scene="night" aria-pressed="false">🌙 夜晚</button></div></div>
<div><div class="row">骑行控制<span class="readout">LIVE MOTION</span></div><div class="actions"><button type="button" id="toggle" aria-pressed="true">Ⅱ 暂停骑行</button><button type="button" id="reset">↺ 重新开始</button></div><p class="hint" id="hint">车轮转动、脚踏和双腿实时联动。首次打开默认自动播放，所有功能均无需登录。</p></div>
</section>
</main><footer><span><b>THE PELICAN TEST</b> · SVG Challenge</span><span>Made for mobile · No libraries · No tracking</span></footer>
</div>
<script>
(function(){
"use strict";
var $ = function(id){return document.getElementById(id)};
var rear=$("rearWheel"),front=$("frontWheel"),slider=$("speed"),stage=$("stage");
var speed=12,active=true,wheel=0,crank=-.5,dist=0,last=0,uiLast=0;
var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if(reduce){active=false;$("hint").textContent="检测到系统减少动态效果设置。点击「继续骑行」即可启动动画。";}
function coord(x,y){return Number(x).toFixed(1)+" "+Number(y).toFixed(1)}
function path(id,d){$(id).setAttribute("d",d)}
function pedal(angle){return {x:488+45*Math.cos(angle),y:469+45*Math.sin(angle)}}
function knee(hip,ankle,a,b,bend){
 var dx=ankle.x-hip.x,dy=ankle.y-hip.y,len=Math.min(Math.hypot(dx,dy),a+b-.01),base=Math.atan2(dy,dx);
 var v=Math.max(-1,Math.min(1,(a*a+len*len-b*b)/(2*a*len)));
 return {x:hip.x+a*Math.cos(base+bend*Math.acos(v)),y:hip.y+a*Math.sin(base+bend*Math.acos(v))};
}
function leg(name,hip,foot,bend){
 var k=knee(hip,foot,119,122,bend),d="M"+coord(hip.x,hip.y)+"L"+coord(k.x,k.y)+"L"+coord(foot.x,foot.y);
 path(name+"LegOuter",d);path(name+"LegInner",d);
 $(name+"Knee").setAttribute("cx",k.x);$(name+"Knee").setAttribute("cy",k.y);
 path(name+"Crank","M488 469L"+coord(foot.x,foot.y));
 path(name+"Pedal","M"+coord(foot.x-21,foot.y+4)+"h48");
 path(name+"Foot","M"+coord(foot.x-10,foot.y-7)+"Q"+coord(foot.x,foot.y-17)+" "+coord(foot.x+10,foot.y-7)+"L"+coord(foot.x+29,foot.y-5)+"Q"+coord(foot.x+36,foot.y+7)+" "+coord(foot.x+15,foot.y+7)+"L"+coord(foot.x-9,foot.y+6)+"Z");
}
function draw(){
 rear.setAttribute("transform","translate(268 469) rotate("+(-wheel*180/Math.PI)+")");
 front.setAttribute("transform","translate(732 469) rotate("+(-wheel*180/Math.PI)+")");
 leg("front",{x:429,y:296},pedal(crank),-1);
 leg("back",{x:398,y:293},pedal(crank+Math.PI),1);
 $("roadmarks").setAttribute("transform","translate("+(-((wheel*21) % 190))+" 0)");
}
function label(){
 var names={day:"☀️ 晴天海岸",sunset:"🌇 夕阳海岸",night:"🌙 月下海岸"};
 var moving=active&&speed>0;
 $("sceneLabel").textContent=names[stage.dataset.scene]+(moving?" · 骑行中":" · 已停靠");
 $("status").textContent=active?(speed>0?"正在骑行":"已停靠"):"已暂停";
 $("toggle").textContent=active?"Ⅱ 暂停骑行":"▶ 继续骑行";
 $("toggle").setAttribute("aria-pressed",String(active));
 $("speedValue").textContent=active?String(speed):"0";
 $("speedText").textContent=speed+" km/h";
}
function frame(t){
 if(!last)last=t;
 var dt=Math.min((t-last)/1000,.05);last=t;
 if(active&&speed>0){
  wheel+=dt*speed/12*2.2;
  crank+=dt*speed/12*1.42;
  dist+=speed*dt/3600;
  draw();
 }
 if(t-uiLast>120){
  $("distanceValue").textContent=dist.toFixed(2);
  $("revsValue").textContent=Math.floor(wheel/(Math.PI*2)).toLocaleString("zh-CN");
  uiLast=t;
 }
 requestAnimationFrame(frame);
}
slider.addEventListener("input",function(){speed=Number(slider.value);label()});
$("toggle").addEventListener("click",function(){active=!active;last=0;label()});
$("reset").addEventListener("click",function(){wheel=0;crank=-.5;dist=0;active=true;$("distanceValue").textContent="0.00";$("revsValue").textContent="0";draw();label()});
Array.prototype.forEach.call(document.querySelectorAll(".scene"),function(btn){
 btn.addEventListener("click",function(){
  stage.dataset.scene=btn.dataset.scene;
  Array.prototype.forEach.call(document.querySelectorAll(".scene"),function(item){item.setAttribute("aria-pressed",String(item===btn))});
  label();
 });
});
draw();label();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
